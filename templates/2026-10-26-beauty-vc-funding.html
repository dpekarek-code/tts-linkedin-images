<!doctype html><html><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:1200px;background:#F6F4EF;font-family:"DejaVu Sans",Helvetica,Arial,sans-serif;color:#14213D;padding:90px 96px;display:flex;flex-direction:column}
.kicker{font-size:26px;letter-spacing:4px;text-transform:uppercase;color:#2A7F7A;font-weight:700}
h1{font-size:68px;line-height:1.08;margin-top:28px;font-weight:800;letter-spacing:-1px}
.sub{font-size:28px;color:#4A5568;margin-top:22px;line-height:1.35}
.chart{margin-top:auto;display:flex;align-items:flex-end;gap:80px;height:470px;padding-left:10px}
.col{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;height:100%}
.val{font-size:64px;font-weight:800}
.deals{font-size:26px;color:#4A5568;margin:6px 0 18px}
.bar{width:330px;border-radius:6px 6px 0 0}
.b1{height:300px;background:#14213D}
.b2{height:40px;background:#2A7F7A}
.lab{font-size:26px;font-weight:700;margin-top:18px}
.lab span{font-weight:400;color:#4A5568}
.base{border-top:3px solid #14213D;margin-top:0}
.foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:56px;font-size:21px;color:#4A5568}
.brand{font-weight:800;letter-spacing:3px;color:#14213D;font-size:24px}
</style></head><body>
<div class="kicker">Beauty startups · Venture capital</div>
<h1>The 2021 playbook<br>ran out of money.</h1>
<div class="sub">Venture capital into beauty startups. Bar heights to scale.</div>
<div class="chart">
  <div class="col"><div class="val">$3.3B</div><div class="deals">388 deals</div><div class="bar b1"></div><div class="lab">2021 <span>· full year</span></div></div>
  <div class="col"><div class="val">$438.8M</div><div class="deals">93 deals</div><div class="bar b2"></div><div class="lab">2024 <span>· Jan–Jul only</span></div></div>
</div>
<div class="foot"><div>Source: PitchBook, “17 US VC firms investing in beauty and skincare”</div><div class="brand">TTS CLINICAL</div></div>
</body></html>
